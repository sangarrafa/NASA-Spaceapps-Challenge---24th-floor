<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build Your Astronaut - Space Base</title>
<link rel="stylesheet" href="src/onboarding/onboarding.css" />
</head>
<body>

<div id="onboarding-card">

  <div id="step-avatar" class="step">
    <h1>Welcome, astronaut</h1>
    <p class="subtitle">Before you run the space base, let's meet you.</p>

    <label for="avatar-name">What's your astronaut name?</label>
    <input type="text" id="avatar-name" placeholder="e.g. Astro Mia" maxlength="20" />

    <button id="avatar-continue" class="primary">Continue</button>
  </div>

  <div id="step-quiz" class="step">
    <h1>How do you like to play?</h1>
    <p class="subtitle">Answer honestly, there's no wrong answer.</p>

    <div id="quiz-progress" class="quiz-progress"></div>
    <p id="quiz-prompt"></p>
    <div id="quiz-options"></div>
  </div>

  <div id="step-badge" class="step">
    <div id="badge-reveal">
      <h1>You've been matched!</h1>
      <img id="avatar-preview-img" alt="" />
      <div class="badge-icon"></div>
      <div class="badge-title"></div>
      <div class="badge-tagline"></div>
      <div class="badge-description"></div>
      <button id="start-mission" class="primary">Start Mission</button>
    </div>
  </div>

</div>

<script type="module" src="src/onboarding/main.js"></script>

</body>
</html>
