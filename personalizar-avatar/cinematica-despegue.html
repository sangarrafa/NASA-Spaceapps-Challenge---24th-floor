<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilibria · Módulo de Lanzamiento</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#060714;overflow:hidden}
#c{display:block;width:100%;height:100%}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity 1.4s ease}
#fade.out{opacity:0}
#terminal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .7s}
#terminal.visible{opacity:1}
#terminal-box{background:rgba(4,6,18,.93);border:2px solid #6FE3E8;border-radius:12px;padding:30px 40px;max-width:min(700px,88vw);box-shadow:0 0 70px rgba(111,227,232,.3),0 0 20px rgba(111,227,232,.12) inset}
#terminal-header{font-family:'Space Mono',monospace;font-size:11px;color:rgba(111,227,232,.5);letter-spacing:.2em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(111,227,232,.18);display:flex;justify-content:space-between}
#terminal-text{font-family:'Space Mono',monospace;font-size:clamp(14px,2vw,19px);line-height:1.75;color:#6FE3E8;min-height:2em}
#terminal-cursor{display:inline-block;width:11px;height:1em;vertical-align:text-bottom;background:#6FE3E8;margin-left:2px;animation:blink .65s step-end infinite}
@keyframes blink{50%{opacity:0}}
#terminal-sub{margin-top:18px;font-family:'Space Mono',monospace;font-size:clamp(11px,1.3vw,13px);color:rgba(255,181,71,.8);opacity:0;transition:opacity .6s}
#terminal-sub.on{opacity:1}
#scanlines{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.14) 2px,rgba(0,0,0,.14) 4px)}
#scanlines.on{opacity:1;transition:opacity .5s}
#crt{position:absolute;inset:0;background:#0a0b1e;transform:scaleY(1);transform-origin:center;opacity:0;pointer-events:none}
#crt.line{transition:transform .18s ease-in,opacity .08s;transform:scaleY(0.012);opacity:1}
#crt.dot{transition:transform .28s ease-in;transform:scale(0.0005);opacity:1}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="terminal">
  <div id="terminal-box">
    <div id="terminal-header">
      <span>EQUILIBRIA BASE · SISTEMA DE LANZAMIENTO v2.4</span>
      <span id="terminal-time">00:00</span>
    </div>
    <div id="terminal-text"><span id="typed"></span><span id="terminal-cursor"></span></div>
    <div id="terminal-sub">— Comandante Ríos &nbsp;·&nbsp; Base Órbita-7</div>
  </div>
</div>
<div id="scanlines"></div>
<div id="crt"></div>

<script src="lib/three.r186.min.js"></script>
<script>
(() => {
'use strict';
// Fall back to CDN if local Three.js didn't load
if (!window.THREE) {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.min.js';
  s.onload = init;
  document.head.appendChild(s);
} else {
  init();
}

function init() {
const SIGUIENTE = new URLSearchParams(location.search).get('siguiente') || 'index.html';
const MSG = '¡Espera! Aún no puedes despegar, debemos tener una ruta de despegue primero. Alístate para la próxima misión.';

/* ── Audio ── */
const sndThrusters = new Audio('audio/cuenta-regresiva.wav');
sndThrusters.volume = 0.6;
let sndStarted = false;

/* ── Renderer ── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

/* ── Scene ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060714);
scene.fog = new THREE.FogExp2(0x060714, 0.022);

/* ── Camera ── */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 300);
camera.position.set(3.8, 3.0, 6.4);
const camTarget = new THREE.Vector3(0, 1.9, 0);
camera.lookAt(camTarget);

/* ── Lights ── */
scene.add(new THREE.HemisphereLight(0x8fa6ff, 0x141634, 1.4));
const sun = new THREE.DirectionalLight(0xdfe6ff, 2.4);
sun.position.set(-4, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6FE3E8, 0.6);
rim.position.set(4, 2, -6);
scene.add(rim);
const flameLight = new THREE.PointLight(0xFF7700, 0, 9);
flameLight.position.set(0, 0.6, 0);
scene.add(flameLight);
const warnPL = new THREE.PointLight(0xFFB547, 0, 8);
warnPL.position.set(-2.2, 3.7, 0);
scene.add(warnPL);

/* ── Stars ── */
{
  const N = 2200, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2*Math.random()-1)*0.4;
    const r = 80 + Math.random() * 30;
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = Math.abs(r * Math.cos(ph)) + 5;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, sizeAttenuation: true, transparent: true, opacity: 0.85 })));
}

/* ── Ground ── */
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x0c0e25, metalness: 0.25, roughness: 0.95 }));
gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; scene.add(gnd);
const grid = new THREE.GridHelper(100, 50, 0x6FE3E8, 0x1a2060);
grid.material.opacity = 0.18; grid.material.transparent = true; scene.add(grid);

/* ── Helper: add mesh to scene ── */
function add(geo, mat, px=0, py=0, pz=0, rx=0, ry=0, rz=0, shadow=true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(px, py, pz);
  m.rotation.set(rx, ry, rz);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  scene.add(m); return m;
}
function addTo(group, geo, mat, px=0, py=0, pz=0, rx=0, ry=0, rz=0, shadow=false) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(px, py, pz); m.rotation.set(rx, ry, rz);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  group.add(m); return m;
}

/* ── Materials ── */
const matPad   = new THREE.MeshStandardMaterial({ color: 0x252860, metalness: 0.55, roughness: 0.6 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x3a3d6e, metalness: 0.65, roughness: 0.5 });
const matNavy  = new THREE.MeshStandardMaterial({ color: 0x1a1c3f, metalness: 0.3,  roughness: 0.85 });
const matPink  = new THREE.MeshStandardMaterial({ color: 0xE8418C, metalness: 0.25, roughness: 0.5 });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xF0F3FF, metalness: 0.3, roughness: 0.5 });
const matNozzle= new THREE.MeshStandardMaterial({ color: 0x4a4d72, metalness: 0.85, roughness: 0.25, side: THREE.DoubleSide });
function matAqua(ei=0.4){ return new THREE.MeshStandardMaterial({ color: 0x6FE3E8, emissive: 0x6FE3E8, emissiveIntensity: ei, metalness: 0.5, roughness: 0.3 }); }
function matAmber(ei=1.5){ return new THREE.MeshStandardMaterial({ color: 0xFFB547, emissive: 0xFFB547, emissiveIntensity: ei }); }

/* ── Launch pad ── */
add(new THREE.CylinderGeometry(2.0, 2.2, 0.18, 8), matPad, 0, 0.09, 0);
add(new THREE.CylinderGeometry(0.85, 1.0, 0.28, 8), matNavy, 0, 0.14, 0);
add(new THREE.BoxGeometry(0.55, 0.9, 1.6), matNavy, 0, -0.3, 0);
// Blast deflectors
{ const def1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 1.5), matSteel);
  def1.position.set(-0.3, -0.1, 0); def1.rotation.z = -0.5; scene.add(def1);
  const def2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 1.5), matSteel);
  def2.position.set(0.3, -0.1, 0); def2.rotation.z = 0.5; scene.add(def2); }
// Accent ring
{ const ring = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.03, 8, 40), matAqua(0.5));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.29; scene.add(ring); }
// Corner supports
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI/2 + Math.PI/4;
  add(new THREE.CylinderGeometry(0.05, 0.07, 0.5, 6), matSteel, Math.cos(a)*1.5, 0.25, Math.sin(a)*1.5);
}
// Pad warning lights (8 around rim)
const warnPadMat = matAmber(2.0);
const blinkMeshes = [];
for (let i = 0; i < 8; i++) {
  const a = i * Math.PI/4;
  const wl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 8), warnPadMat);
  wl.position.set(Math.cos(a)*1.7, 0.21, Math.sin(a)*1.7); scene.add(wl);
  blinkMeshes.push(wl);
}

/* ── Rocket ── */
const rocketG = new THREE.Group();
const ROCKET_Y = 0.95;
rocketG.position.set(0, ROCKET_Y, 0);
// Launch mount struts holding the rocket above the flame trench
for (let i = 0; i < 3; i++) {
  const a = i * Math.PI*2/3 + Math.PI/6;
  const top = new THREE.Vector3(Math.sin(a)*0.34, ROCKET_Y, Math.cos(a)*0.34);
  const bot = new THREE.Vector3(Math.sin(a)*0.75, 0.28, Math.cos(a)*0.75);
  const len = top.distanceTo(bot);
  const st = new THREE.Mesh(new THREE.BoxGeometry(0.07, len, 0.07), matPink);
  st.position.copy(top).add(bot).multiplyScalar(0.5);
  st.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), top.clone().sub(bot).normalize());
  st.castShadow = true; scene.add(st);
}
{ const mr = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.035, 8, 24), matSteel);
  mr.rotation.x = Math.PI/2; mr.position.y = ROCKET_Y; scene.add(mr); }
scene.add(rocketG);

addTo(rocketG, new THREE.CylinderGeometry(0.21, 0.27, 2.2, 20), matWhite, 0, 1.38, 0, 0,0,0, true);
const rocketKey = new THREE.SpotLight(0xffffff, 6, 12, 0.35, 0.6);
rocketKey.position.set(3, 4, 4); rocketKey.target = rocketG; scene.add(rocketKey);
addTo(rocketG, new THREE.ConeGeometry(0.21, 0.65, 20), matPink, 0, 2.78, 0, 0,0,0, true);
addTo(rocketG, new THREE.CylinderGeometry(0.215, 0.215, 0.07, 20), matAqua(0.4), 0, 2.4, 0);
addTo(rocketG, new THREE.CylinderGeometry(0.215, 0.215, 0.05, 20), matPink, 0, 2.0, 0);
addTo(rocketG, new THREE.CylinderGeometry(0.1, 0.19, 0.3, 14, 1, true), matNozzle, 0, 0.1, 0);

// Nozzle inner glow
const nozzleGlowMat = new THREE.MeshStandardMaterial({ color: 0xFF8822, emissive: 0xFF8822, emissiveIntensity: 0, side: THREE.DoubleSide });
{ const ng = new THREE.Mesh(new THREE.CircleGeometry(0.1, 14), nozzleGlowMat);
  ng.rotation.x = Math.PI/2; ng.position.set(0, -0.04, 0); rocketG.add(ng); }

// 3 Fins
for (let i = 0; i < 3; i++) {
  const a = i * Math.PI * 2/3;
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.65, 0.4), matPink);
  fin.position.set(Math.sin(a)*0.3, 0.44, Math.cos(a)*0.3);
  fin.rotation.y = -a; fin.castShadow = true; rocketG.add(fin);
}
// Porthole
{ const pf = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.05, 16),
    new THREE.MeshStandardMaterial({ color: 0x2b2d4c, metalness: 0.9, roughness: 0.1 }));
  pf.position.set(0.235, 1.9, 0); pf.rotation.z = Math.PI/2; rocketG.add(pf);
  const pg = new THREE.Mesh(new THREE.CircleGeometry(0.055, 16),
    new THREE.MeshStandardMaterial({ color: 0x21C1E0, emissive: 0x21C1E0, emissiveIntensity: 1.2 }));
  pg.position.set(0.258, 1.9, 0); pg.rotation.y = Math.PI/2; rocketG.add(pg); }
// Hatch
addTo(rocketG, new THREE.BoxGeometry(0.045, 0.3, 0.19),
  new THREE.MeshStandardMaterial({ color: 0xDADDF0, metalness: 0.3, roughness: 0.5 }),
  -0.238, 1.5, 0);
// Landing legs
for (let i = 0; i < 3; i++) {
  const a = i * Math.PI*2/3 + Math.PI/6;
  const ll = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 6), matSteel);
  ll.position.set(Math.sin(a)*0.26, 0.2, Math.cos(a)*0.26);
  ll.rotation.z = Math.sin(a)*0.4; ll.rotation.x = Math.cos(a)*0.4; rocketG.add(ll);
}

/* ── Service tower ── */
const towerG = new THREE.Group();
towerG.position.set(-2.3, 0, 0.2);
scene.add(towerG);

const colPos = [[-0.22,-0.22],[0.22,-0.22],[-0.22,0.22],[0.22,0.22]];
for (const [cx,cz] of colPos) addTo(towerG, new THREE.BoxGeometry(0.07,3.8,0.07), matSteel, cx,1.9,cz);
for (let y = 0.5; y <= 3.5; y += 0.5) {
  addTo(towerG, new THREE.BoxGeometry(0.44,0.04,0.04), matSteel, 0,y,-0.22);
  addTo(towerG, new THREE.BoxGeometry(0.44,0.04,0.04), matSteel, 0,y, 0.22);
  addTo(towerG, new THREE.BoxGeometry(0.04,0.04,0.44), matSteel,-0.22,y,0);
  addTo(towerG, new THREE.BoxGeometry(0.04,0.04,0.44), matSteel, 0.22,y,0);
}
// Service arm
addTo(towerG, new THREE.BoxGeometry(1.95,0.08,0.08), matPink, 1.07,1.8,0);
addTo(towerG, new THREE.BoxGeometry(0.08,0.3,0.08), matPink, 2.0,1.65,0);
// Tower flood lights
const floodMat = new THREE.MeshStandardMaterial({ color: 0xFFE566, emissive: 0xFFE566, emissiveIntensity: 2.5 });
for (let i = 0; i < 3; i++) {
  addTo(towerG, new THREE.BoxGeometry(0.13,0.09,0.13), floodMat, 0.25, 0.9+i*0.9, -0.32);
  const fpl = new THREE.PointLight(0xFFE566, 0.4, 4);
  fpl.position.set(0.25, 0.9+i*0.9, -0.32); towerG.add(fpl);
}
// Ladder rungs
for (let y = 0.3; y < 3.5; y += 0.25)
  addTo(towerG, new THREE.BoxGeometry(0.3,0.025,0.025), matSteel, 0,y,-0.24);
// Tower warn sphere
const warnSphMat = new THREE.MeshStandardMaterial({ color: 0xFFB547, emissive: 0xFFB547, emissiveIntensity: 2 });
{ const ws = new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), warnSphMat);
  ws.position.set(0,3.95,0); towerG.add(ws); }

/* ── Fuel tanks ── */
const tankPositions = [[3.1,0,-3.2],[4.3,0,-2.5]];
for (const [tx,ty,tz] of tankPositions) {
  add(new THREE.CylinderGeometry(0.52,0.52,2.8,14), matNavy, tx,1.4,tz);
  add(new THREE.SphereGeometry(0.52,14,10,0,Math.PI*2,0,Math.PI/2), matNavy, tx,2.8,tz);
  add(new THREE.CylinderGeometry(0.53,0.53,0.06,14), matAqua(0.3), tx,1.6,tz, 0,0,0, false);
  add(new THREE.CylinderGeometry(0.53,0.53,0.06,14), matAqua(0.3), tx,2.0,tz, 0,0,0, false);
}

/* ── Control bunker ── */
add(new THREE.BoxGeometry(3.2,0.9,1.6), matNavy, -4.5,0.45,-4);
add(new THREE.BoxGeometry(3.4,0.1,1.8), matSteel, -4.5,0.95,-4);
for (let i = 0; i < 5; i++)
  add(new THREE.BoxGeometry(0.28,0.2,0.06), new THREE.MeshStandardMaterial({ color:0xFFE566, emissive:0xFFE566, emissiveIntensity:1.8 }), -5.9+i*0.8,0.5,-3.2, 0,0,0, false);
add(new THREE.BoxGeometry(1.4,0.3,0.05), matAqua(0.6), -4.5,0.75,-3.19, 0,0,0, false);

/* ── Pipes ── */
for (let i = 0; i < 2; i++) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,2.1,8), matSteel);
  p.position.set(-1.1,0.95,(i-0.5)*0.3); p.rotation.z = Math.PI/5; scene.add(p);
}
{ const fl = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,3.5,6), matAqua(0.2));
  fl.position.set(1.6,0.4,-1.8); fl.rotation.z=0.4; fl.rotation.y=0.8; scene.add(fl); }

/* ── Runway lights ── */
for (let i = 0; i < 10; i++)
  add(new THREE.CylinderGeometry(0.055,0.055,0.05,8), matAmber(1.8), -2+i*0.6,0.025,3.2-i*0.08, 0,0,0, false);
add(new THREE.BoxGeometry(0.08,0.02,4.0), matAqua(0.3), 0,0.01,2.5, 0,0,0, false);

/* ── Antenna ── */
add(new THREE.CylinderGeometry(0.015,0.015,0.8,4), matSteel, -3.2,1.4,-3.5, 0,0,0, false);
{ const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.08,0.1,10,1,true), matSteel);
  dish.position.set(-3.2,1.9,-3.5); dish.rotation.x=-0.6; scene.add(dish); }

/* ── Flame particles ── */
const N_FLAME = 1400;
const fp = new Float32Array(N_FLAME * 3);
for (let i = 0; i < N_FLAME; i++) fp[i*3+1] = -100;
const fVel = Array.from({length:N_FLAME}, ()=>({vx:0,vy:0,vz:0}));
const fLife = new Float32Array(N_FLAME);
const fCol = new Float32Array(N_FLAME * 3);
const fMaxLife = new Float32Array(N_FLAME);
const fGeo = new THREE.BufferGeometry();
fGeo.setAttribute('position', new THREE.BufferAttribute(fp, 3));
fGeo.setAttribute('color', new THREE.BufferAttribute(fCol, 3));
const spriteTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();
const fMat = new THREE.PointsMaterial({ map: spriteTex, size: 0.3, vertexColors: true, transparent: true, opacity: 0, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending });
const flamePts = new THREE.Points(fGeo, fMat);
flamePts.frustumCulled = false;
scene.add(flamePts);

const NOZZLE_Y = ROCKET_Y - 0.06;
const TRENCH_Y = 0.3;
let flameOn = false, flameIntensity = 0, spawnTick = 0;

function spawnFlame() {
  for (let i = 0; i < N_FLAME; i++) {
    if (fLife[i] <= 0) {
      const sp = 0.1 * flameIntensity;
      fp[i*3]   = (Math.random()-.5)*sp;
      fp[i*3+1] = NOZZLE_Y;
      fp[i*3+2] = (Math.random()-.5)*sp;
      const spd = (1.8 + Math.random()*2.8) * flameIntensity;
      fVel[i].vx = (Math.random()-.5)*0.5*flameIntensity;
      fVel[i].vy = -spd;
      fVel[i].vz = (Math.random()-.5)*0.5*flameIntensity;
      fLife[i] = fMaxLife[i] = 0.35 + Math.random()*0.45;
      return;
    }
  }
}

function tickFlame(dt) {
  if (flameOn) {
    spawnTick += dt;
    while (spawnTick > 0.0025) { spawnTick -= 0.0025; spawnFlame(); }
    fMat.opacity = Math.min(0.95, fMat.opacity + dt*4);
    flameLight.intensity = flameIntensity*5 + Math.sin(Date.now()*.025)*.8;
    nozzleGlowMat.emissiveIntensity = flameIntensity * 3.5;
  } else {
    fMat.opacity = Math.max(0, fMat.opacity - dt*2);
    flameLight.intensity = Math.max(0, flameLight.intensity - dt*3);
    nozzleGlowMat.emissiveIntensity = Math.max(0, nozzleGlowMat.emissiveIntensity - dt*3);
  }
  for (let i = 0; i < N_FLAME; i++) {
    if (fLife[i] <= 0) continue;
    fLife[i] -= dt;
    if (fLife[i] <= 0) { fLife[i]=0; fp[i*3+1]=-100; continue; }
    fp[i*3]   += fVel[i].vx*dt;
    fp[i*3+1] += fVel[i].vy*dt;
    fp[i*3+2] += fVel[i].vz*dt;
    if (fp[i*3+1] < TRENCH_Y) {
      // Exhaust hits the pad and billows outward
      fp[i*3+1] = TRENCH_Y;
      const ang = Math.atan2(fp[i*3+2], fp[i*3]) + (Math.random()-.5)*0.6, sp = Math.abs(fVel[i].vy)*0.7;
      fVel[i].vx = Math.cos(ang)*sp; fVel[i].vz = Math.sin(ang)*sp; fVel[i].vy = 0.25 + Math.random()*0.5;
    }
    fVel[i].vx *= 0.975; fVel[i].vz *= 0.975;
    const age = 1 - fLife[i]/fMaxLife[i];
    fCol[i*3]   = 1;
    fCol[i*3+1] = Math.max(0.15, 0.95 - age*1.1);
    fCol[i*3+2] = Math.max(0.02, 0.7 - age*2.2);
    if (age > 0.7) { const k = 1 - (age-0.7)/0.3; fCol[i*3]*=k; fCol[i*3+1]*=k; fCol[i*3+2]*=k; }
  }
  fGeo.attributes.position.needsUpdate = true;
  fGeo.attributes.color.needsUpdate = true;
}

/* ── Camera positions ── */
const CAM = {
  overview: { p: new THREE.Vector3(3.8,3.0,6.4), t: new THREE.Vector3(0,1.9,0) },
  nozzle:   { p: new THREE.Vector3(0.95,0.85,1.55), t: new THREE.Vector3(0,0.65,0) },
  medium:   { p: new THREE.Vector3(2.6,2.2,4.4), t: new THREE.Vector3(-0.2,1.6,0) },
};
const camCurT = camTarget.clone();

/* ── State machine ── */
const PHASES = ['FADE_IN','IGNITE','ZOOM','THRUSTERS','TERMINAL','CRT_CLOSE'];
const DUR = { FADE_IN:1.5, IGNITE:2.2, ZOOM:3.0, THRUSTERS:3.5, TERMINAL:9999, CRT_CLOSE:1.5 };
let phase = 'FADE_IN', pT = 0;
let msgDoneAt = -1, typedChars = 0, typeAcc = 0;
let warnTick = 0;
let elapsed = 0;

function enterPhase(ph) {
  if (ph === 'IGNITE') {
    flameOn = true;
    if (!sndStarted) { sndStarted=true; sndThrusters.play().catch(()=>{}); }
  }
  if (ph === 'TERMINAL') {
    document.getElementById('terminal').classList.add('visible');
    document.getElementById('scanlines').classList.add('on');
    typedChars=0; typeAcc=0;
  }
  if (ph === 'CRT_CLOSE') {
    sndThrusters.pause();
    const crt = document.getElementById('crt');
    crt.style.opacity='1'; crt.style.pointerEvents='all';
    setTimeout(()=>crt.classList.add('line'),60);
    setTimeout(()=>crt.classList.add('dot'),320);
    setTimeout(()=>{ location.href=SIGUIENTE; },980);
  }
}

/* ── Timer ── */
const timer = new THREE.Timer();
timer.connect(document);
setTimeout(()=> document.getElementById('fade').classList.add('out'), 100);

renderer.setAnimationLoop(() => {
  timer.update();
  const dt = Math.min(timer.getDelta(), 0.05);
  pT += dt; elapsed += dt;

  // Phase transitions
  const dur = DUR[phase];
  if (phase !== 'TERMINAL' && phase !== 'CRT_CLOSE' && pT >= dur) {
    pT -= dur;
    const idx = PHASES.indexOf(phase);
    if (idx < PHASES.length-1) { phase = PHASES[idx+1]; enterPhase(phase); }
  }
  if (phase === 'TERMINAL' && msgDoneAt > 0 && elapsed - msgDoneAt >= 10) {
    phase = 'CRT_CLOSE'; pT=0; enterPhase('CRT_CLOSE');
  }

  // Flame
  if (phase === 'IGNITE') flameIntensity = Math.min(1, pT/DUR.IGNITE);
  else if (flameOn) flameIntensity = 1.0;
  tickFlame(dt);

  // Blink
  warnTick += dt;
  const bv = Math.sin(warnTick*3.8) > 0 ? 1.8 : 0.1;
  warnSphMat.emissiveIntensity = bv; warnPL.intensity = bv*0.5;
  const pv = Math.sin(warnTick*1.5)*0.5+0.5;
  warnPadMat.emissiveIntensity = 0.8 + pv*1.6;

  // Camera
  let tp, tt;
  if (phase === 'FADE_IN' || phase === 'IGNITE') {
    tp = CAM.overview.p; tt = CAM.overview.t;
  } else if (phase === 'ZOOM') {
    const f = ss(Math.min(1, pT/DUR.ZOOM));
    tp = new THREE.Vector3().lerpVectors(CAM.overview.p, CAM.nozzle.p, f);
    tt = new THREE.Vector3().lerpVectors(CAM.overview.t, CAM.nozzle.t, f);
  } else if (phase === 'THRUSTERS') {
    tp = CAM.nozzle.p; tt = CAM.nozzle.t;
  } else {
    const f = ss(Math.min(1, pT/2.5));
    tp = new THREE.Vector3().lerpVectors(CAM.nozzle.p, CAM.medium.p, f);
    tt = new THREE.Vector3().lerpVectors(CAM.nozzle.t, CAM.medium.t, f);
  }
  camera.position.lerp(tp, Math.min(1, dt*2.8));
  camCurT.lerp(tt, Math.min(1, dt*2.8));
  camera.lookAt(camCurT);

  // Terminal typing
  if (phase === 'TERMINAL' && typedChars < MSG.length) {
    typeAcc += dt;
    const steps = Math.floor(typeAcc / 0.03);
    if (steps > 0) {
      typeAcc %= 0.03;
      typedChars = Math.min(MSG.length, typedChars+steps);
      document.getElementById('typed').textContent = MSG.slice(0, typedChars);
      if (typedChars >= MSG.length && msgDoneAt < 0) {
        msgDoneAt = elapsed;
        document.getElementById('terminal-cursor').style.display = 'none';
        document.getElementById('terminal-sub').classList.add('on');
      }
    }
  }

  // Terminal clock
  if (phase === 'TERMINAL') {
    const s = Math.floor(elapsed);
    document.getElementById('terminal-time').textContent =
      String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }

  renderer.render(scene, camera);
});

function ss(x){ return x*x*(3-2*x); }

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

}
})();
</script>
