<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión Equilibria — Bienvenida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>

  <form id="card" autocomplete="off">
    <div class="kicker">ACADEMIA DE CADETES ESPACIALES</div>
    <h1>¡Bienvenido a la misión <span class="eq">Equilibria</span>!</h1>
    <p class="pide">Para comenzar, escribe tu nombre completo <span id="aqui">aquí:</span></p>
    <div class="campo">
      <input id="nombre" type="text" maxlength="60" placeholder="Tu nombre y apellido" aria-label="Escribe tu nombre completo" spellcheck="false">
    </div>
    <button id="go" type="submit" disabled>¡Comenzar misión! ▶</button>
    <div class="msg" id="msg"></div>
  </form>

  <svg id="flecha" aria-hidden="true"><path class="linea" id="fl"/><path id="punta"/></svg>

  <div id="saludo"><h2 id="hola"></h2><p>Preparando tu misión…</p></div>
</div>

<script src="../../audio/audio-ambiente.js"></script>
<script src="bienvenida.js"></script>
</body>
</html>
