<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Lunar base map — Equilibria Mission">Mapa de la base lunar — Misión Equilibria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720" aria-label="Mapa de la base lunar con cinco estaciones de misión y un camino bloqueado hacia Marte" data-en-aria="Lunar base map with five mission stations and a locked path to Mars"></canvas>

  <div id="panel">
    <div class="k" data-en="LUNIA BASE · SOUTH POLE">BASE LUNIA · POLO SUR</div>
    <h1 data-en="Mission map">Mapa de misiones</h1>
    <div class="barra"><i id="barra"></i></div>
    <div id="prog" data-en="Missions completed: 0 of 5">Misiones completadas: 0 de 5</div>
  </div>

  <div id="tip"><h3 id="tNom"></h3><p id="tDesc"></p><div class="estado" id="tEst"></div><button id="tGo" data-en="Enter ▶">Entrar ▶</button></div>
  <div id="aviso" data-en="🚀 Your rocket can now travel to Mars!">🚀 ¡Tu cohete ya puede viajar a Marte!</div>

  <button id="btnSonido" aria-label="Silenciar sonido ambiental" title="Sonido ambiental" data-en-aria="Mute background sound" data-en-title="Background sound">🔊</button>
  <!-- El navegador usa el primer formato que sepa reproducir y no descarga los demás -->
  <audio id="ambiente" loop preload="auto">
    <source src="sonido-ambiental.m4a" type="audio/mp4">
    <source src="sonido-ambiental.wav" type="audio/wav">
  </audio>

  <div id="demo">
    <button id="dComp" title="Solo para la presentación" data-en-title="Only for the presentation" data-en="Demo: complete missions">Demo: completar misiones</button>
    <button id="dReset" data-en="Reset">Reiniciar</button>
  </div>
</div>

<script src="../shared/language.js"></script>
<script src="../audio/sfx.js"></script>
<script src="mapa-base.js"></script>
</body>
</html>
