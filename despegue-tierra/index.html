<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antes del despegue — Cinemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720" aria-label="El cadete sube al cohete, se enciende el motor y la escena se detiene antes del despegue"></canvas>
  <div id="ctrl">
    <button id="bSnd" aria-pressed="true">🔊 Sonido</button>
    <button id="bSkip">Saltar ⏭</button>
  </div>
  <div id="pausa">
    <div class="marca">⏸ CUENTA REGRESIVA DETENIDA</div>
    <h2 id="txt"></h2>
    <button id="bNext">Siguiente ▶</button>
    <button id="otra">↺ Ver de nuevo</button>
  </div>
</div>

<script src="despegue-tierra.js"></script>
</body>
</html>
